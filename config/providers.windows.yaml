# HAL Provider Configuration — Windows variant
# Same as providers.yaml, but api_key_source uses env vars instead of macOS Keychain.
# Set these with `setx` in Git Bash / PowerShell, then open a fresh terminal.
#
#   setx GRIP_GROQ_API_KEY "..."
#   setx GRIP_GEMINI_API_KEY "..."
#   setx GRIP_DASHSCOPE_API_KEY "..."
#   setx GRIP_DEEPSEEK_API_KEY "..."
#   setx GRIP_XAI_API_KEY "..."
#   setx GRIP_OPENAI_API_KEY "..."
#   ... etc for each provider you need
#
# The `env:` prefix is parsed by HAL's _resolve_api_key() — no keychain required.

providers:
  - name: groq
    type: cloud
    base_url: https://api.groq.com/openai/v1
    api_key_source: env:GRIP_GROQ_API_KEY
    # Mirrors providers.yaml (refreshed 2026-08-30): llama-3.3-70b-versatile,
    # llama-4-scout-17b-16e-instruct and deepseek-r1-distill-llama-70b are
    # RETIRED upstream. gpt-oss + qwen3.8-27b are the current chat models;
    # qwen3.6-27b answers 404 since 2026-11-24.
    models: [openai/gpt-oss-120b, openai/gpt-oss-20b, qwen/qwen3.8-27b, whisper-large-v3-turbo]
    default: true
    # tool_unfriendly_models: REMOVED 2026-08-30 — see providers.yaml (both
    # referenced models retired at Groq; no replacement pair re-verified).

  - name: gemini
    type: cloud
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_source: env:GRIP_GEMINI_API_KEY
    # gemma-4-27b retired upstream (2026-08-30); Gemma 4 line is 26b-a4b-it / 31b-it.
    models: [gemini-3.1-pro-preview, gemma-4-31b-it, gemini-3.5-flash, gemini-3.5-flash-lite, gemini-4-argon, gemini-3.6-flash, gemini-3.8-flash, gemini-4-carbon, gemini-4-hydrogen, gemini-4-neon]
    # gemini-3.5-flash deprecated 2026-10-08 (requests routed to gemini-3.6-flash); kept
    # while accepted. gemini-3.6-flash and gemini-3.8-flash: Stable, served 2026-10-18.
    # gemini-4-argon (GA 2026-10-13) LAST on purpose: position is behaviour for a
    # one-word qualifier (tests/test_gemini_catalogue_parity.py).
    # SUNSET 2026-11-24 (GRIP#9389): gemini-2.5-flash removed, replaced by
    # gemini-3.5-flash-lite (the redirect target from 2026-12-01) — see
    # config/providers.yaml for the full note.
    # gemini-4-carbon and gemini-4-hydrogen added 2026-11-24 (dogfood-domain
    # phase 2 family 6) — see config/providers.yaml for the full note.
    # gemini-4-neon added 2026-11-26, appended LAST — same note.

  - name: qwen
    type: cloud
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    api_key_source: env:GRIP_DASHSCOPE_API_KEY
    # qwen3.6-plus-preview retired (2026-08-30); qwen3.8-* is current.
    models: [qwen3.5-flash, qwen3.5-plus, qwen3.6-plus, qwen3.8-flash, qwen3.8-max, qwen4-max]
    # qwen4-max added 2026-11-24, mirroring config/providers.yaml.

  - name: deepseek
    type: cloud
    base_url: https://api.deepseek.com/v1
    api_key_source: env:GRIP_DEEPSEEK_API_KEY
    # 2026-10-26: API serves exactly {deepseek-flash, deepseek-v4-pro};
    # chat/reasoner/v3.2 RETIRED; v4-flash/-vision-exp renamed to deepseek-flash.
    models: [deepseek-flash, deepseek-v4-pro]

  - name: moonshot
    type: cloud
    base_url: https://api.moonshot.ai/v1
    api_key_source: env:GRIP_MOONSHOT_API_KEY
    # Kimi lineage added 2026-07-26 (live on GET /v1/models; issue #509 item 1).
    # kimi-k2.5 and moonshot-v1* retired 2026-08-31 (platform.kimi.ai/docs/models.md);
    # the API now returns 404 for them. Exactly these four ids were served by
    # GET /v1/models on 2026-09-07 (tests/test_moonshot_endpoint.py liveness anchor).
    # Mirrors providers.yaml, including kimi-k3.1-pro and -highspeed (2026-11-24), last.
    models: [kimi-k3, kimi-k2.6, kimi-k2.7-code, kimi-k2.7-code-highspeed, kimi-k3.1-pro, kimi-k3.1-pro-highspeed]

  - name: kimi-coding
    type: cloud
    # Kimi Code membership (GRIP Pool D, seal e49c00c214c500be) -- see the
    # macOS block in providers.yaml for the full note. Windows reads the key
    # from the env var the GRIP resolver tries first for this service
    # (lib/provider_secret.env_candidates("grip-kimi-coding")[0]).
    base_url: https://api.kimi.com/coding/v1
    api_key_source: env:KIMI_CODING_API_KEY
    models: [k3, k3-256k, kimi-for-coding, kimi-for-coding-highspeed]

  - name: zhipu
    type: cloud
    base_url: https://api.z.ai/api/coding/paas/v4
    api_key_source: env:GRIP_ZHIPU_API_KEY
    # glm-5.4 joined 2026-11-24 (docs.z.ai/guides/llm/glm-5.4.md, read 2026-11-24), LAST
    # so no one-token qualifier that names an older id moves. Mirrors providers.yaml.
    models: [glm-5.1, glm-5-turbo, glm-5, glm-5.3, glm-5.3-flash, glm-4.7, glm-4.6, glm-4.5, glm-4.5-air, glm-5.4]

  - name: mistral
    type: cloud
    base_url: https://api.mistral.ai/v1
    api_key_source: env:GRIP_MISTRAL_API_KEY
    models: [mistral-small-latest, mistral-large-latest]

  - name: openrouter
    type: cloud
    base_url: https://openrouter.ai/api/v1
    api_key_source: env:GRIP_OPENROUTER_API_KEY
    models: [openai/gpt-5.6-sol, openai/gpt-5.6-terra, openai/gpt-5.6-luna, google/gemma-4-31b-it, google/gemma-4-26b-a4b-it, meta-llama/llama-4-maverick]

  - name: openai
    type: cloud
    base_url: https://api.openai.com/v1
    api_key_source: env:GRIP_OPENAI_API_KEY
    models: [gpt-6.2-astra, gpt-6.2-sol, gpt-6-astra, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.5, gpt-5.4, gpt-5.4-mini, gpt-4o, gpt-4o-mini, o3-mini]
    # gpt-6.2-astra and gpt-6.2-sol added 2026-11-24 -- mirrors providers.yaml;
    # see that file's comment for the vendor facts and pricing.
    #
    # gpt-6-astra added 2026-09-08: released 2026-09-03. Verified serving, not
    # merely addressable: this org's GET /v1/models (125 ids, still the only
    # gpt-6* id, no dated snapshot, no -pro id) plus HTTP 200 on both wires --
    # chat/completions 1.82s, responses 2.16s. Address-only: never a routing
    # default, chain member or council seat ($10/$50 per 1M, 2.5x Sol) -- that
    # is a price decision, not a gap in the evidence. Liveness anchor:
    # tests/test_gpt6_astra_liveness.py (opt-in, OPENAI_LIVE=1).

  - name: soruxgpt
    type: cloud
    base_url: https://service.soruxgpt.com/api/api
    api_key_source: env:GRIP_SORUXGPT_API_KEY
    models: [gpt-4o, gpt-4o-mini, claude-3-5-sonnet-20241022, deepseek-chat, gemini-2.0-flash-exp]

  - name: vulavula
    type: cloud
    base_url: https://api.lelapa.ai/v1
    api_key_source: env:GRIP_VULAVULA_API_KEY
    models: [translate, transcribe, sentiment]
    custom_adapter: vulavula

  - name: xai
    type: cloud
    base_url: https://api.x.ai/v1
    api_key_source: env:GRIP_XAI_API_KEY
    # ids re-read from a LIVE GET /v1/models on 2026-09-15 (12 ids returned).
    # The previous list was five-sixths stale and grok-3 was wired into three
    # routing structures below, all of them dead. Mirrors providers.yaml,
    # including the 2026-11-24 removal of grok-build-0.1 (404) and the
    # 2026-11-24 addition of grok-4.7 (dogfood-domain family 5, appended last
    # as the newest id).
    models: [grok-4.20-0309-reasoning, grok-4.20-0309-non-reasoning, grok-4.20-multi-agent-0309, grok-4.6, grok-4.5, grok-4.3, grok-4.7]


  - name: lemonade
    type: local
    base_url: http://localhost:7860/v1
    detect: true
    models: auto

  - name: ollama
    type: local
    base_url: http://localhost:11434/v1
    detect: true
    models: auto

  - name: vllm
    type: local
    base_url: http://localhost:8000/v1
    detect: true
    models: auto

  - name: lmstudio
    type: local
    base_url: http://localhost:1234/v1
    detect: true
    models: auto

  - name: mlx_vlm
    type: local
    base_url: http://localhost:8080/v1
    auth: none
    detect: true
    models: auto
    timeout_s: 180

  - name: bitnet
    type: local
    base_url: http://127.0.0.1:8114/v1
    auth: none
    models: [bitnet-b1.58-2b4t]

routing:
  default: fallback
  # 2026-08-30: llama-3.3-70b-versatile retired at Groq; gpt-oss-120b keeps the
  # same Groq-fast/free-tier shape.
  default_model: groq/openai/gpt-oss-120b
  fallback_chain: [groq/openai/gpt-oss-120b, gemini/gemini-3.5-flash-lite, xai/grok-4.6, openrouter/google/gemma-4-31b-it, qwen/qwen3.5-flash, deepseek/deepseek-flash, ollama/gemma4:26b]
  quality_cost:
    simple: groq/openai/gpt-oss-120b
    standard: openrouter/google/gemma-4-31b-it
    complex: gemini/gemini-4-carbon
    local: ollama/gemma4:26b

  tier_chains:
    free:    [ollama/gemma4:26b, ollama/gemma4:e4b]
    cheap:   [qwen/qwen3.5-flash, openrouter/google/gemma-4-31b-it, groq/openai/gpt-oss-120b]
    mid:     [gemini/gemini-3.5-flash-lite, openrouter/google/gemma-4-31b-it, deepseek/deepseek-flash]
    premium: [xai/grok-4.20-0309-reasoning, gemini/gemini-4-carbon, deepseek/deepseek-v4-pro, groq/openai/gpt-oss-120b]

  council: [groq/openai/gpt-oss-120b, openrouter/google/gemma-4-31b-it, gemini/gemini-3.5-flash-lite, xai/grok-4.6, qwen/qwen3.5-flash, deepseek/deepseek-flash]
