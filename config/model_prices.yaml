# HAL list prices -- versioned, read by lib/hal/infinite_cost.py.
#
# InfiniteMachine v2, Step 4 (cost truth). A thread row records three figures
# that are never merged: the usage the response reported, its LIST-price
# equivalent from this table, and what was actually spent. This table only
# answers the second question.
#
# Units: US dollars per million tokens, written as quoted decimal strings so no
# binary float ever enters a price. A rate the vendor does not publish is null,
# and a request that used it gets no list price (and a warning), never a guess.
#
# Rows:
#   version            this model's price version, raised when a new row is added
#   effective          the first UTC date the row prices; it is the day every
#                      figure in the row was read from the vendor, because the
#                      vendor's own start date for a price is not recorded
#   input / output     fresh input and output tokens
#   cache_read         cache hits (Anthropic "cache hits and refreshes")
#   cache_write        cache writes at the default lifetime (Anthropic 5 minutes)
#   cache_write_1h     Anthropic 1-hour cache writes
#   max_prompt_tokens  optional: the largest prompt (fresh + cached + written
#                      input) this row prices; a larger request bills at a tier
#                      this table does not carry, so it gets no list price
#   source             where every figure came from (HAL file:line, vendor page)
#
# Seeded on 2026-10-05 from the dated figures already in lib/hal/cost_tracker.py
# and config/model_catalog.yaml. Left out on purpose, so they price as unknown:
# rows whose vendor read date HAL never recorded; xAI (long prompts bill double
# above a threshold HAL has not recorded); the Opus fast variants and Claude
# Haiku 3.5 (not on the vendor's current page for the first-party API); and
# models HAL has no figure for yet. Adding a price: append a row with the next
# version and its own effective date, never edit a row that has priced traffic.
#
# The gpt-5.6 rows take cost_tracker.py's 2026-09-08 vendor read. The catalog's
# descriptions quote other figures (model_catalog.yaml:332-333, 349, 365:
# $5/$30, $2.50/$15, $1/$6) with no read date, so they are not used here.

version: 1
unit: USD per million tokens

models:
