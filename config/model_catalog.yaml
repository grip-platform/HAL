    paid: true
    modality: text+vision
    context_window: 1000000
    tags: [frontier, reasoning, coding, long-context, agentic]
    strengths:
      - Current Fable generation; the vendor lists Fable 5.1 as legacy beside it (read 2026-11-11)
      - Cheaper than Fable 5.1 on every column -- $8 in / $40 out, $0.20 cache hits, $10 and $16 cache writes
      - 1M token context at standard pricing; thinking always on; default effort high
    description: >
      Anthropic's recommended model "for demanding reasoning and long-horizon
      agentic work" (models overview, read 2026-11-11). CCH must advertise Claude
