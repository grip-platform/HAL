# HAL Model Catalogue — per-model metadata for the /models picker.
#
# This file is consumed by lib/hal/models_command.py to render rich,
# grouped, filterable listings. Provider config (base_url, api_key_source,
# routing) lives in providers.yaml; this file holds the user-facing
# metadata that providers.yaml deliberately omits.
#
# Schema per entry:
#   address          provider/model-name (matches parse_model_address())
#   tier             free | cheap | mid | premium | frontier | subscription | local
#   paid             true if pay-per-token, false if free or flat-fee
#   modality         text | text+vision | text+audio | multimodal
#   context_window   integer tokens (input window)
#   tags             list of capability hints (frontier, fast, reasoning,
#                    coding, vision, multilingual, creative, long-context)
#   strengths        bullet list — what this model is *best* at
#   description      one paragraph — when to pick this model
#
# Tier semantics:
#   subscription  flat-fee plan (e.g. Anthropic Pro/Max via OAuth) —
#                 zero cost per request, finite quota
#   frontier      cutting-edge quality, highest pay-per-token cost
#   premium       strong reasoning models, mid-high cost
#   mid           balanced quality/cost workhorse
#   cheap         high-volume, latency-sensitive, low cost
#   free          actually free (or local — see local tier)
#   local         runs on the user's hardware, no network egress
#
# Adding a model: also confirm the bare ID is listed in providers.yaml.
# Removing a model: keep this file in sync with providers.yaml.

models:

  # ────────────────────────────────────────────────────────────────
  # SUBSCRIPTION TIER (flat-fee, zero per-request cost)
  # ────────────────────────────────────────────────────────────────
  #
  # Anthropic rows carry no providers.yaml entry by design: Claude is reached
  # through CCH (the Claude Code subscription signer), and a provider row would
  # misattribute subscription spend as metered API spend. Every row here must
  # still have its OWN price row in lib/hal/cost_tracker.py, and a model that
  # Anthropic gates by client version must have its floor in
  # lib/hal/utils/cch.py _MODEL_MIN_CC_VERSION — tests/test_anthropic_catalogue_parity.py
  # fails naming the file that lacks it.

